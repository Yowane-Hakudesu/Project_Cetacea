<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>鲸鱼娘 图标预览</title>
<style>
  body{margin:0;padding:32px;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1b2438}
  h1{font-size:20px;margin:0 0 4px}
  p.hint{margin:0 0 24px;color:#5b6780;font-size:13px}
  .grid{display:flex;gap:28px;flex-wrap:wrap}
  figure{margin:0;text-align:center;width:220px}
  .box{width:200px;height:200px;border-radius:24px;background:
      conic-gradient(#e3e8f2 0 25%,#fff 0 50%,#e3e8f2 0 75%,#fff 0) 0 0/20px 20px;
      display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .box img{width:160px;height:160px}
  figcaption{font-size:13px;color:#3a465e}
  code{font-size:11px;color:#7a869e}
</style>
<h1>鲸鱼娘 图标预览</h1>
<p class="hint">棋盘格 = 透明区域。右键图片可直接“另存为 PNG”，或把 SVG 上传到任意在线转换工具导出多尺寸。</p>
<div class="grid">
  <figure>
    <div class="box"><img src="whale-chan-icon.svg" alt="手机端图标"></div>
    <figcaption>手机端图标<br><code>whale-chan-icon.svg</code></figcaption>
  </figure>
  <figure>
    <div class="box"><img src="whale-chan-companion-icon.svg" alt="伴侣端图标"></div>
    <figcaption>伴侣端图标<br><code>whale-chan-companion-icon.svg</code></figcaption>
  </figure>
  <figure>
    <div class="box"><img src="whale-chan-notification.svg" alt="通知小图标（纯白）"></div>
    <figcaption>通知小图标（纯白）<br><code>whale-chan-notification.svg</code></figcaption>
  </figure>
</div>
