name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        请先确认建议符合项目的硬规则：不添加隐蔽/对抗能力、不绕过系统权限、不破坏隐私默认值。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: "现在每次都要手动…"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
    validations:
      required: false

  - type: checkboxes
    id: rules
    attributes:
      label: 合规确认
      options:
        - label: 该建议不涉及隐藏应用、对抗检测或绕过 Android 权限
          required: true
        - label: 该建议不会把用户数据发送到用户未配置的端点
          required: true
